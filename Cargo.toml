[package]
name = "rust-embedding-runtime"
version = "0.3.1-rc.1"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
description = "Community Rust CPU text-embedding runtime for EmbeddingGemma 2"
repository = "https://github.com/A-K-6/rust-embedding-runtime"
exclude = ["model/", "tests/reference/"]
default-run = "embedding-runtime"

[features]
profile = []
aocl = ["dep:aocl-kernels"]

[workspace]
members = ["crates/aocl-kernels"]
default-members = ["."]

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
aocl-kernels = { path = "crates/aocl-kernels", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "=0.11.0", features = ["accelerate"] }

[dependencies]
anyhow = "1"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
base64 = "0.22"
rayon = "1"
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "embedding-runtime"
path = "src/main.rs"

[[bin]]
name = "embedding-jsonl"
path = "src/jsonl.rs"
