name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 -m unittest discover -s benchmarks -p test_amd_matrix.py
  image:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            cpu_target: x86-64
          - runner: ubuntu-24.04-arm
            cpu_target: x86-64
          - runner: ubuntu-24.04
            cpu_target: x86-64-v3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" --build-arg AMD64_CPU_TARGET="${{ matrix.cpu_target }}" --tag runtime-test .
      - run: python3 tests/smoke.py --image runtime-test
